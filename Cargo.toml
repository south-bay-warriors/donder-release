[package]
name = "donder-release"
version = "1.5.3"
authors = ["Bruno Morgado <bruno@southbaywarriors.com>"]
description = "Quickly create releases on Github from the command line or CI using conventional commits."
license = "MIT"
edition = "2024"
repository = "https://github.com/south-bay-warriors/donder-release"
homepage = "https://github.com/south-bay-warriors/donder-release"
documentation = "https://github.com/south-bay-warriors/donder-release#readme"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
chrono = "0.4"
regex = "1.12"
semver = "1.0"
dotenv = "0.15"

[dev-dependencies]
tempfile = "3"
