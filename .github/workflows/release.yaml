name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: Release type
        required: true
        type: choice
        options:
          - release
          - beta

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run donder-release
        id: donder
        run: |
          VERSION_BEFORE=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "${{ inputs.type }}" = "beta" ]; then
            cargo run -- --pre-id beta
          else
            cargo run
          fi
          VERSION_AFTER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$VERSION_BEFORE" != "$VERSION_AFTER" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish to crates.io
        if: steps.donder.outputs.released == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to npm
        if: steps.donder.outputs.released == 'true'
        run: |
          if [ "${{ inputs.type }}" = "beta" ]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
